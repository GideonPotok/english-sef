<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sefaria Reader">
<meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181b" media="(prefers-color-scheme: dark)">
<title>Sefaria Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one column of segment rows; each row pairs the Hebrew (right) with Sefaria's English or a labelled machine translation (left). Tap a row for its commentaries. */
:root{
  --bg:#f6f7f4; --paper:#fdfdfb; --fg:#1c2024; --muted:#5d6670; --rule:#d9ddd6;
  --accent:#1d6b5a; --accent-ink:#ffffff; --he:#8a5a00; --he-bg:#fbf3df;
  --mt:#6b4fa0; --mt-bg:#efe9f8; --sel:#e9f2ef;
  --f-ui:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-he:"Frank Ruhl Libre","David",Georgia,serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --fs:1.05rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181b; --paper:#1c2024; --fg:#e6e8e3; --muted:#9aa3ab; --rule:#2e343a;
    --accent:#6fcbb3; --accent-ink:#0f1a17; --he:#e2b35a; --he-bg:#2a2416;
    --mt:#b9a3e6; --mt-bg:#2a2338; --sel:#1f2a27; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181b; --paper:#1c2024; --fg:#e6e8e3; --muted:#9aa3ab; --rule:#2e343a;
  --accent:#6fcbb3; --accent-ink:#0f1a17; --he:#e2b35a; --he-bg:#2a2416;
  --mt:#b9a3e6; --mt-bg:#2a2338; --sel:#1f2a27; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:400 var(--fs)/1.55 var(--f-en);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font-family:var(--f-ui);font-size:1rem;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--rule);border-radius:999px;padding:.35rem .8rem;line-height:1.2}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
a{color:var(--accent)}
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.hdr-in{max-width:52rem;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:.6rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.brand{font:700 1.15rem/1 var(--f-he);white-space:nowrap;text-decoration:none;color:var(--fg)}
.brand small{font:500 .7rem var(--f-ui);color:var(--muted);display:block;margin-top:.2rem;letter-spacing:.08em;text-transform:uppercase}
.search{flex:1 1 14rem;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:.5rem 2.4rem .5rem 1rem;font-size:1rem}
.search .clear{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);border:0;padding:.2rem .5rem;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + .4rem);background:var(--paper);border:1px solid var(--rule);border-radius:.8rem;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:70vh;overflow:auto;z-index:6}
.results:empty{display:none}
.res{padding:.6rem .9rem;border-bottom:1px solid var(--rule);cursor:pointer;display:flex;justify-content:space-between;gap:.8rem;align-items:baseline}
.res:last-child{border-bottom:0}
.res:hover,.res:focus{background:var(--bg)}
.res .t{font-family:var(--f-ui);font-weight:500}
.res .k{font-family:var(--f-ui);font-size:.8rem;color:var(--muted);white-space:nowrap}
.res.he .t{font-family:var(--f-he);direction:rtl}
.res.note{color:var(--muted);font-family:var(--f-ui);font-size:.85rem;cursor:default;display:block}
.res.top{background:var(--sel)}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.prog{height:2px;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0;transition:width .25s}
main{max-width:52rem;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:1rem 4rem}
.home h1{font:500 1.9rem/1.15 var(--f-he);margin:.6rem 0 .3rem;text-wrap:balance}
.home p{color:var(--muted);font-family:var(--f-ui);max-width:36rem}
.home h2,.recent h2{font:600 .75rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:1.4rem 0 .5rem}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.5rem}
.cal a{display:block;text-decoration:none;color:var(--fg);border:1px solid var(--rule);border-radius:.7rem;padding:.6rem .8rem;background:var(--paper)}
.cal a:hover{border-color:var(--accent)}
.cal .l{font:500 .72rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal .v{font:500 1.05rem/1.25 var(--f-ui);margin:.15rem 0}
.cal .h{font-family:var(--f-he);direction:rtl;text-align:right;color:var(--he)}
.recent ul{list-style:none;padding:0;margin:0;display:grid;gap:.3rem}
.recent a{display:flex;justify-content:space-between;gap:1rem;text-decoration:none;color:var(--fg);padding:.5rem .7rem;border:1px solid var(--rule);border-radius:.6rem;font-family:var(--f-ui)}
.recent a span:last-child{font-family:var(--f-he);color:var(--muted);direction:rtl}
.banner{background:var(--he-bg);color:var(--he);border-radius:.6rem;padding:.6rem .9rem;font-family:var(--f-ui);font-size:.9rem;margin:.6rem 0}
.banner.err{background:var(--mt-bg);color:var(--mt)}
/* text head */
.ah{margin:.4rem 0 1rem;border-bottom:1px solid var(--rule);padding-bottom:.8rem}
.ah h1{font:600 1.8rem/1.15 var(--f-en);margin:.2rem 0;text-wrap:balance}
.ah .he-title{font:500 1.3rem/1.2 var(--f-he);direction:rtl;text-align:right;color:var(--he);margin:0 0 .5rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-family:var(--f-ui);font-size:.85rem;margin-top:.5rem}
.modes{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.modes button{border:0;border-radius:0;padding:.35rem .75rem;font-size:.85rem}
.modes button+button{border-left:1px solid var(--rule)}
.chip{display:inline-block;border-radius:999px;padding:.2rem .6rem;font-weight:500;font-size:.78rem}
.chip.mt{background:var(--mt-bg);color:var(--mt)} .chip.en{background:var(--sel);color:var(--accent)}
.vers{font-size:.78rem;color:var(--muted);font-family:var(--f-ui);margin-top:.4rem}
.status{margin-left:auto;font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:.6rem;margin:1.2rem 0}
.nav button{font-size:.9rem}
/* segments */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.4rem 1.4rem;padding:.7rem .6rem;border-radius:.5rem;border-bottom:1px solid var(--rule);cursor:pointer;position:relative}
.seg:hover{background:var(--paper)}
.seg.open{background:var(--sel)}
.seg .n{position:absolute;left:.6rem;top:.75rem;font:500 .7rem var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.seg .he{grid-column:2;direction:rtl;text-align:right;font-family:var(--f-he);font-size:1.12em;line-height:1.75;unicode-bidi:isolate}
.seg .en{grid-column:1;font-family:var(--f-en);padding-left:1.6rem;unicode-bidi:isolate}
.seg .en.mt{color:var(--fg)} .seg .en.mt::before{content:"machine translation";display:block;font:500 .65rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mt)}
.seg .en.pending{color:var(--muted);font-family:var(--f-ui);font-size:.9em}
.seg .en.missing{color:var(--muted);font-style:italic;font-size:.9em}
.seg h3{grid-column:1/-1;margin:.6rem 0 0;font:600 .8rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.body[data-mode="he"] .seg{grid-template-columns:1fr} .body[data-mode="he"] .seg .en{display:none} .body[data-mode="he"] .seg .he{grid-column:1}
.body[data-mode="en"] .seg{grid-template-columns:1fr} .body[data-mode="en"] .seg .he{display:none} .body[data-mode="en"] .seg .en{grid-column:1}
@media (max-width:640px){
  .seg{grid-template-columns:1fr}
  .seg .he{grid-column:1;padding-left:0;order:1} .seg .en{grid-column:1;padding-left:0;padding-top:.1rem;order:2} .seg .n{order:0} .seg .links{order:3}
  .seg .n{position:static;display:block}
}
.body[data-nikud="off"] .he .nk{display:none}
.he b,.en b{font-weight:600}
.he big{font-size:1.15em}
/* commentary drawer */
.links{grid-column:1/-1;background:var(--paper);border:1px solid var(--rule);border-radius:.6rem;padding:.6rem .8rem;margin-top:.4rem;cursor:default;font-family:var(--f-ui);font-size:.9rem}
.links h4{margin:.2rem 0 .4rem;font:600 .72rem var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.links .grp{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.5rem}
.links .grp button{font-size:.82rem;padding:.25rem .6rem;display:inline-flex;gap:.35rem;align-items:center}
.links .grp button i{font-style:normal;font-size:.7rem;color:var(--muted)}
.links .grp button.noen i{color:var(--mt)}
.links .empty{color:var(--muted)}
.foot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--rule);font:400 .8rem/1.5 var(--f-ui);color:var(--muted)}
.skel{height:1em;background:var(--rule);border-radius:.3em;margin:.5em 0;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fsz{display:inline-flex;gap:.2rem}.fsz button{padding:.3rem .6rem;font-family:var(--f-en)}

.settings-back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:1rem}
@media (min-width:640px){.settings-back{align-items:center}}
.settings{background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:1rem;padding:1.1rem 1.2rem;width:min(30rem,100%);max-height:90vh;overflow:auto;font-family:var(--f-ui);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.settings h2{margin:0 0 .3rem;font:600 1.1rem var(--f-ui)}
.settings p{margin:0 0 .8rem;color:var(--muted);font-size:.85rem}
.settings .f{display:grid;gap:.25rem;margin:.7rem 0;font-size:.85rem}
.settings .f span{font-weight:500}
.settings .f input{width:100%;border:1px solid var(--rule);border-radius:.5rem;padding:.45rem .6rem;background:var(--bg);font:1rem var(--f-ui)}
.settings .f small{color:var(--muted)}
.settings .c{display:flex;gap:.4rem;align-items:center;font-size:.85rem;margin:.5rem 0}
.settings .row{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;margin-top:1rem}
.pstatus{list-style:none;margin:0 0 .6rem;padding:.5rem .7rem;border:1px solid var(--rule);border-radius:.6rem;font-size:.82rem;display:grid;gap:.2rem}
.pstatus li{display:flex;justify-content:space-between;gap:1rem}
.pstatus .ok{color:var(--accent)} .pstatus .bad{color:var(--muted)}

.offline{display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:1.4rem;padding-top:.8rem;border-top:1px solid var(--rule);font:400 .8rem/1.5 var(--f-ui);color:var(--muted)}
.offline button{font-size:.8rem;padding:.25rem .7rem}
.tag{display:inline-block;margin-left:.5rem;font:500 .65rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 .4rem;vertical-align:middle}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="#" id="brand">ספריא<small>Reader</small></a>
    <div class="search">
      <input id="q" type="search" placeholder="Reference or name: Bereshit 18, ברכות ב, Rashi on Genesis 18:1…" autocomplete="off" dir="auto" aria-label="Search Sefaria">
      <button class="clear" id="clear" aria-label="Clear search" hidden>×</button>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <div class="tools">
      <button id="nikud" aria-pressed="true" title="Show vowel points and cantillation">Nikud</button>
      <button id="settings" title="Translation settings" aria-label="Translation settings">Translators</button>
      <span class="fsz"><button id="fsm" aria-label="Smaller text">A−</button><button id="fsp" aria-label="Larger text">A+</button></span>
    </div>
  </div>
  <div class="prog"><i id="prog"></i></div>
</header>
<main id="main"></main>

<script>
(() => {
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (k==='class') e.className=v; else if (k==='html') e.innerHTML=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v!==false && v!=null) e.setAttribute(k, v); } for (const k of kids) if (k!=null) e.append(k); return e; };
const HEB = /[א-ת]/;
const NIKUD = /[֑-ֽֿ-ׇׂׅׄ]/g;
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{return d;} }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };
const toUrl = ref => ref.replace(/ /g,'_').replace(/:/g,'.');
const fromUrl = u => u.replace(/_/g,' ').replace(/\./g,':').replace(/(\D):(\d)/g,'$1 $2');

/* ---------- Sefaria API ---------- */
const sefCacheable = path => /^\/api\/(v3\/texts|links|calendars)/.test(path);
async function sef(path) { return sefCacheable(path) ? cachedFetchJSON('sef|' + path, () => sefFetch(path)) : sefFetch(path); }
async function sefFetch(path) {
  const r = await fetch('https://www.sefaria.org' + path);
  const raw = await r.text();
  let j; try { j = JSON.parse(raw); } catch { throw new Error(`Sefaria replied with something other than JSON (HTTP ${r.status}): ${raw.slice(0,140).replace(/\s+/g,' ')}`); }
  if (!r.ok || j.error) throw new Error(j.error || `Sefaria: HTTP ${r.status}`);
  return j;
}

/* ---------- Machine translation (Google's public endpoint, no key) ---------- */
/* ---------- Offline cache (IndexedDB): fetched pages, translations, and an index of saved titles ---------- */
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try {
    const r = indexedDB.open('reader-cache', 1);
    r.onupgradeneeded = () => { const d = r.result; for (const n of ['pages', 'tr', 'meta']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'k' }).createIndex('at', 'at'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
  } catch (e) { rej(e); } }));
  const tx = async (st, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(st, mode); let out; try { out = fn(t.objectStore(st)); } catch (e) { rej(e); } t.oncomplete = () => res(out && typeof out === 'object' && 'result' in out ? out.result : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    get: (st, k) => tx(st, 'readonly', s => s.get(k)).catch(() => undefined),
    put: (st, v) => tx(st, 'readwrite', s => s.put(v)).catch(() => {}),
    putMany: (st, vs) => tx(st, 'readwrite', s => { vs.forEach(v => s.put(v)); }).catch(() => {}),
    all: st => tx(st, 'readonly', s => s.getAll()).catch(() => []),
    del: (st, k) => tx(st, 'readwrite', s => s.delete(k)).catch(() => {}),
    clear: st => tx(st, 'readwrite', s => s.clear()).catch(() => {}),
    count: st => tx(st, 'readonly', s => s.count()).catch(() => 0),
    size: st => tx(st, 'readonly', s => s.getAll()).then(all => all.reduce((a, x) => a + (x.size || 0), 0)).catch(() => 0),
    // Delete the oldest entries until the store is within budget.
    trim: async (st, maxBytes) => { const all = await tx(st, 'readonly', s => s.getAll()).catch(() => []); let total = all.reduce((a, x) => a + (x.size || 0), 0); if (total <= maxBytes) return; all.sort((a, b) => a.at - b.at); const kill = []; for (const x of all) { if (total <= maxBytes) break; kill.push(x.k); total -= x.size || 0; } await tx(st, 'readwrite', s => { kill.forEach(k => s.delete(k)); }).catch(() => {}); },
  };
})();
const PAGE_BUDGET = 80e6, TR_BUDGET = 40e6;
const cachePut = (k, v) => { const s = JSON.stringify(v); return idb.put('pages', { k, v, at: Date.now(), size: s.length }).then(() => { if (Math.random() < 0.1) idb.trim('pages', PAGE_BUDGET); }); };
// Network first; on failure (or when the browser says it is offline) the saved copy, marked with __cachedAt.
async function cachedFetchJSON(key, doFetch) {
  const fromCache = async () => { const c = await idb.get('pages', key); if (!c) return null; const v = c.v; try { Object.defineProperty(v, '__cachedAt', { value: c.at, enumerable: false, configurable: true }); } catch {} return v; };
  if (navigator.onLine === false) { const c = await fromCache(); if (c) return c; }
  try { const v = await doFetch(); cachePut(key, v); return v; }
  catch (e) { const c = await fromCache(); if (c) return c; throw e; }
}
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 2 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const fmtMB = n => (n / 1e6).toFixed(n < 1e6 ? 2 : 1) + ' MB';
// Translations live in memory, are loaded from IndexedDB at start, and are written back in batches.
const tcache = new Map(); const tdirtyKeys = new Set();
const cacheSet = (k, v) => { tcache.set(k, v); tdirtyKeys.add(k); };
const tcacheReady = (async () => {
  try {
    const rows = await idb.all('tr'); rows.forEach(r => tcache.set(r.k, r.v));
    const legacy = store.get('tr', null); // entries from the earlier localStorage cache
    if (legacy && typeof legacy === 'object') { const now = Date.now(); const vs = []; for (const [k, v] of Object.entries(legacy)) if (!tcache.has(k)) { tcache.set(k, v); vs.push({ k, v, at: now, size: k.length + v.length }); } if (vs.length) await idb.putMany('tr', vs); try { localStorage.removeItem('tr'); } catch {} }
  } catch {}
})();
let saveTick = 0;
async function saveCache() {
  if (!tdirtyKeys.size) return;
  const now = Date.now(); const vs = [...tdirtyKeys].map(k => ({ k, v: tcache.get(k), at: now, size: k.length + (tcache.get(k) || '').length })); tdirtyKeys.clear();
  await idb.putMany('tr', vs);
  if (++saveTick % 25 === 0) idb.trim('tr', TR_BUDGET);
}
setInterval(saveCache, 4000);
async function offlineSummary() {
  const [pages, trs, pSize, tSize] = await Promise.all([idb.count('meta'), idb.count('tr'), idb.size('pages'), idb.size('tr')]);
  return { pages, trs, bytes: pSize + tSize };
}
async function clearOffline() { await Promise.all([idb.clear('pages'), idb.clear('tr'), idb.clear('meta')]); tcache.clear(); tdirtyKeys.clear(); }
const MT_DOMAIN = 'Jewish religious texts from Sefaria: Tanakh, Talmud, midrash, halakhah and rabbinic commentary; render divine names conventionally and keep technical terms recognizable';
let translateBroken = false, translateError = '', translateVia = '';
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Translation providers ----------
   Free, keyless endpoints first; anything you give a key for takes over when those are throttled
   (or goes first, for Claude, if you say so in settings). A provider that fails is rested for a while
   and the next one picks up the same batch. Keys live only in this browser's localStorage. */
const TK = { get: () => store.get('tkeys', {}), set: v => store.set('tkeys', v) };
const down = {};
const cool = (name, ms) => { down[name] = Date.now() + ms; };
const decodeEntities = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
function chunk(t, n) { if (t.length <= n) return [t]; const out = []; let cur = ''; for (const s of t.split(/(?<=[.!?:;׃])\s+/)) { if ((cur + ' ' + s).length > n && cur) { out.push(cur); cur = s; } else cur = cur ? cur + ' ' + s : s; } if (cur) out.push(cur); return out.flatMap(p => p.length <= n ? [p] : p.match(new RegExp(`[\\s\\S]{1,${n}}`, 'g'))); }
async function fetchJSON(url, init) {

    row.append(box);

      const links = await sef('/api/links/' + encodeURIComponent(toUrl(row.dataset.ref)) + '?with_text=0');
      if (!row.contains(box)) return;
      const groups = new Map();
      for (const l of links) { const cat = l.category || 'Other'; const name = l.collectiveTitle?.en || l.index_title || l.sourceRef; const g = groups.get(cat) || new Map(); groups.set(cat, g); const it = g.get(name) || {name, he:l.collectiveTitle?.he, refs:[], hasEn:false}; it.refs.push(l.sourceRef); it.hasEn = it.hasEn || !!l.sourceHasEn; g.set(name, it); }
      const order = ['Commentary','Targum','Midrash','Talmud','Halakhah','Chasidut','Kabbalah','Quoting Commentary','Reference'];
      const cats = [...groups.keys()].sort((a,b) => (order.indexOf(a)+1||99) - (order.indexOf(b)+1||99));
      box.replaceChildren(el('h4', {}, 'On ' + row.dataset.ref + ' · ' + links.length + ' connections'));
      if (!cats.length) box.append(el('div', {class:'empty'}, 'Nothing links here yet.'));
      for (const c of cats) {
        const g = [...groups.get(c).values()];
        box.append(el('h4', {}, c), el('div', {class:'grp'}, ...g.map(it => el('button', {class: it.hasEn ? '' : 'noen', title: it.hasEn ? 'Sefaria has English' : 'No English on Sefaria; will be machine translated', onclick:()=>go(it.refs.length === 1 ? it.refs[0] : commonRef(it.refs))}, it.name, el('i', {}, (it.refs.length > 1 ? it.refs.length + ' · ' : '') + (it.hasEn ? 'EN' : 'MT'))))));
      }
    } catch (e) { if (row.contains(box)) box.replaceChildren(el('div', {class:'empty'}, 'Could not load connections: ' + e.message)); }
  }
  // Several comments of one commentator on one verse share a parent ref ("Rashi on Genesis 18:1:1" → "Rashi on Genesis 18:1").
  const commonRef = refs => { const a = refs[0]; const m = /^(.*):\d+$/.exec(a); return m && refs.every(r => r.startsWith(m[1]+':')) ? m[1] : a; };

  // Machine-translate what Sefaria lacks, visible rows first.
  if (needMT.length) {
    let done = 0; status.textContent = `Translating 0/${needMT.length}`;
    await translateMany(needMT.map(x => x.src), (i, v) => {
      const x = needMT[i]; x.el.classList.remove('pending');
      if (v) { x.el.textContent = v; x.el.classList.add('mt'); } else { x.el.classList.add('missing'); x.el.textContent = 'No translation available.'; }
      done++; if (tok === loadToken) { prog.style.width = (100*done/needMT.length)+'%'; status.textContent = done < needMT.length ? `Translating ${done}/${needMT.length}` + (translateVia && translateVia!=='Google' ? ' via '+translateVia : '') : (translateBroken ? 'Translation failed' : (translateVia && translateVia!=='Google' ? 'Translated via '+translateVia : '')); if (done === needMT.length) setTimeout(() => { if (tok===loadToken) prog.style.width = '0%'; }, 600); }
    });
    if (translateBroken && tok === loadToken) main.insertBefore(el('div', {class:'banner err'}, 'Translation failed (' + translateError + '); untranslated segments show the Hebrew only.'), body);
  }
}

route();
})();
</script>
